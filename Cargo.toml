[workspace]
members = [".", "examples"]

[package]
name = "kyro"
version = "0.1.1"
edition = "2021"
description = "A high-performance ML inference engine"
license = "MIT"

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
safetensors = "0.3.1"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
prometheus = "0.14"
tokenizers = "0.22"
futures = "0.3"
async-stream = "0.3"
cudarc = { version = "0.9", optional = true }
opentelemetry = { version = "0.33.0", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.0", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.34.0", optional = true }

[features]
default = []
cuda = ["dep:cudarc", "candle-core/cuda"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokenizers = "0.22"
candle-core = "0.10.2"
prometheus = "0.14"
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
[[bench]]
name = "scheduler_bench"
harness = false
